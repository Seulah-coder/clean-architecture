plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.9'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.code '
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

test {
    useJUnitPlatform()
    
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
        exceptionFormat = "full"
    }
    
    afterSuite { desc, result ->
        if (!desc.parent) {
            println ""
            println "=" * 70
            println " 테스트 실행 결과"
            println "=" * 70
            println " 상태: ${result.resultType}"
            println " 전체: ${result.testCount}개"
            println " ✅ 성공: ${result.successfulTestCount}개"
            println " ❌ 실패: ${result.failedTestCount}개"
            println " ⏭️  건너뜀: ${result.skippedTestCount}개"
            println " 실행 시간: ${(result.endTime - result.startTime) / 1000}초"
            println "=" * 70
            println ""
        }
    }
}

